name: rastro

x-rastro-environment: &rastro-environment
  RASTRO_OPENAPI_ENABLED: "0"

  RASTRO_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/postgres"

  RASTRO_SERVICE_NAMESPACE: "rastro"
  RASTRO_SERVICE_NAME: "rastro"
  RASTRO_DEPLOYMENT_ID: "6da45eb569938b3ec583769821fe0ef6320e1275"
  RASTRO_DEPLOYMENT_ENVIRONMENT: "prod"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4318"

services:
  migrate:
    build:
      context: .
      dockerfile: dockerfile
    command: alembic upgrade head
    environment: *rastro-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: dockerfile
    environment: *rastro-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The exporters flush at exit, and with no collector the flush outlasts the stop timeout.
      otel:
        condition: service_started
    ports:
      - published: ${RASTRO_API_PORT}
        target: 8000

  worker:
    build:
      context: .
      dockerfile: dockerfile
    command: procrastinate --app=rastro.worker.app worker
    environment:
      <<: *rastro-environment
      # Grafana tells the spans of the worker from the spans of the API.
      RASTRO_SERVICE_NAME: "rastro-worker"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel:
        condition: service_started

  postgres:
    image: "postgres:latest"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - published: ${RASTRO_POSTGRES_PORT}
        target: 5432
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -d ${POSTGRES_DB:-postgres} -U
          ${POSTGRES_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql

  clickhouse:
    image: "clickhouse/clickhouse-server:26.2"
    environment:
      CLICKHOUSE_DB: "clickhouse"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "clickhouse"
    ports:
      - name: Native
        published: ${RASTRO_CLICKHOUSE_NATIVE_PORT}
        target: 9000
      - name: HTTP
        published: ${RASTRO_CLICKHOUSE_HTTP_PORT}
        target: 8123
    healthcheck:
      test: [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping ||
          exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: volume
        source: clickhouse_data
        target: /var/lib/clickhouse

  otel:
    image: "otel/opentelemetry-collector-contrib:0.148.0"
    environment:
      RASTRO_OTEL_CLICKHOUSE_ENDPOINT: "tcp://clickhouse:9000"
      RASTRO_OTEL_CLICKHOUSE_USERNAME: "clickhouse"
      RASTRO_OTEL_CLICKHOUSE_PASSWORD: "clickhouse"
    ports:
      - name: Healthcheck
        published: ${RASTRO_OTEL_HEALTHCHECK_PORT}
        target: 13133
      - name: HTTP
        published: ${RASTRO_OTEL_HTTP_PORT}
        target: 4318
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - "./docker/otel/config.yaml:/etc/otelcol-contrib/config.yaml"

  grafana:
    image: "grafana/grafana:main"
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      RASTRO_GF_CLICKHOUSE_HOST: "clickhouse"
      RASTRO_GF_CLICKHOUSE_PORT: "9000"
      RASTRO_GF_CLICKHOUSE_PROTOCOL: "native"
      RASTRO_GF_CLICKHOUSE_USER: "clickhouse"
      RASTRO_GF_CLICKHOUSE_PASSWORD: "clickhouse"
    ports:
      - name: UI
        published: ${RASTRO_GRAFANA_PORT}
        target: 3000
    volumes:
      # TODO: bind local dashboards and data sources
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
      - type: bind
        source: ./docker/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true

volumes:
  postgres_data:
  grafana_data:
  clickhouse_data:
