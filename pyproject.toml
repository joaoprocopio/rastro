[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "rastro"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django-extensions>=4.1",
    "django[argon2]>=6.0.3",
    "gunicorn>=25.3.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-django>=0.61b0",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "opentelemetry-instrumentation-psycopg2>=0.64b0",
    "opentelemetry-sdk>=1.40.0",
    "psycopg2>=2.9.11",
    "pydantic>=2.13.3",
]

[dependency-groups]
dev = [
    "django-stubs-ext>=6.0.1",
    "django-stubs[compatible-mypy]>=6.0.1",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "model-bakery>=1.23.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.13",
]

[tool.mypy]
strict = true
exclude = '(^|/)migrations/'
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
warn_unreachable = true
no_implicit_optional = true
strict_optional = true
warn_no_return = true
show_error_codes = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

# factory_boy ships py.typed, but its declarations have untyped __init__ methods.
[[tool.mypy.overrides]]
module = "rastro.*.tests.factories"
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "rastro.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rastro.settings.test"
addopts = "-s --cov src/"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.dispatch.receiver".msg = "Signals hold no business logic. Put the rule in a service."
"django.views.decorators.csrf.csrf_exempt".msg = "No API is exempt from CSRF."

[tool.importlinter]
root_packages = ["rastro"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "iam layers"
type = "layers"
containers = ["rastro.iam"]
layers = [
    "services",
    "models",
    "values",
]
# The manager in models is an edge: it calls a service with the hasher from deps.
ignore_imports = ["rastro.iam.models -> rastro.iam.services"]

[[tool.importlinter.contracts]]
name = "values import no framework"
type = "forbidden"
source_modules = ["rastro.*.values"]
forbidden_modules = ["django", "pydantic", "pydantic_core"]
ignore_imports = [
    "rastro.common.values -> pydantic",
    "rastro.common.values -> pydantic_core",
]

[[tool.importlinter.contracts]]
name = "services and selectors import no pydantic"
type = "forbidden"
source_modules = ["rastro.iam.services"]
forbidden_modules = ["pydantic", "pydantic_core"]
# Every values module reaches pydantic through rastro.common.values, its adapter.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services and selectors never import adapters"
type = "forbidden"
source_modules = ["rastro.iam.services"]
forbidden_modules = ["rastro.iam.adapters"]
ignore_imports = ["rastro.iam.models -> rastro.iam.deps"]

[[tool.importlinter.contracts]]
name = "only deps imports adapters"
type = "forbidden"
source_modules = ["rastro.iam.*"]
forbidden_modules = ["rastro.iam.adapters"]
ignore_imports = ["rastro.iam.deps -> rastro.iam.adapters"]
