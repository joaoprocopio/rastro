[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[project]
name = "rastro"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.40.0",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.fastapi]
entrypoint = "rastro.api:app"

[tool.alembic]
script_location = "%(here)s/src/rastro/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
exclude = ["^worktrees/"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["src", "tests"]

[tool.poe.tasks]
lint = ["_ruff_check", "_ruff_format_check", "_mypy", "_lint_imports"]
test = "pytest"
coverage = "pytest --cov src/"
check = ["lint", "test"]
_ruff_check = "ruff check ."
_ruff_format_check = "ruff format --check ."
_mypy = "mypy ."
_lint_imports = "lint-imports"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.testclient".msg = "Use httpx.AsyncClient with ASGITransport, so a test runs on the app's event loop."
"starlette.testclient".msg = "Use httpx.AsyncClient with ASGITransport, so a test runs on the app's event loop."

[tool.importlinter]
root_packages = ["rastro"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the domain imports no other layer and no framework but pydantic"
type = "forbidden"
source_modules = ["rastro.**.domain"]
forbidden_modules = [
    "rastro.**.application",
    "rastro.**.infrastructure",
    "rastro.**.presentation",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "procrastinate",
]

[[tool.importlinter.contracts]]
name = "the application imports no infrastructure, presentation, sqlalchemy, or fastapi"
type = "forbidden"
source_modules = ["rastro.**.application"]
forbidden_modules = [
    "rastro.**.infrastructure",
    "rastro.**.presentation",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "procrastinate",
]

[[tool.importlinter.contracts]]
name = "the infrastructure imports no application or presentation"
type = "forbidden"
source_modules = ["rastro.**.infrastructure"]
forbidden_modules = ["rastro.**.application", "rastro.**.presentation"]

[[tool.importlinter.contracts]]
name = "only the dependencies of the presentation import the infrastructure"
type = "forbidden"
source_modules = ["rastro.**.presentation"]
forbidden_modules = ["rastro.**.infrastructure"]
ignore_imports = ["rastro.**.presentation.dependencies -> rastro.**.infrastructure.**"]
# A view imports dependencies, which import the infrastructure to build adapters.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only the wiring imports the security app"
type = "forbidden"
source_modules = ["rastro.*"]
forbidden_modules = ["rastro.security"]
ignore_imports = [
    "rastro.api_app -> rastro.security.**",
    "rastro.security.** -> rastro.security.**",
]
