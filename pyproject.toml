[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "rastro"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.fastapi]
entrypoint = "rastro.main:app"

[tool.alembic]
script_location = "%(here)s/src/rastro/database/revisions"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = true
warn_unreachable = true
strict_bytes = true
extra_checks = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["src", "conftest.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "I",   # isort
    "PGH", # pygrep-hooks: blanket `type: ignore`
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"**/__tests__/**" = ["S101", "S105", "S106"]
"src/rastro/database/revisions/**" = ["I"]

[tool.pytest.ini_options]
addopts = "--cov src/"
testpaths = ["src"]
